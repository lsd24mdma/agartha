<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGARTHA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background-image: url("tlo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            font-family: Arial, sans-serif;
        }

        /* NAPIS */
        .napis {
            position: absolute;
            top: 25px;
            left: 30px;

            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7b00,
                #ffff00,
                #00ff00,
                #00ffff,
                #0066ff,
                #aa00ff,
                #ff00aa
            );

            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: kolory 5s ease infinite;
        }

        /* ZNAK */
        .znak {
            position: absolute;
            top: 25px;
            right: 30px;

            width: 90px;
            height: 90px;

            animation: obrot 6s linear infinite;
        }

        @keyframes obrot {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes kolory {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>

<body>

    <div class="napis">
        AGARTHA IST
    </div>

    <img class="znak" src="znak.png" alt="Znak">

</body>
</html>
