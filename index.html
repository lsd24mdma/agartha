<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGARTHA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background-image: url("tlo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            font-family: Arial, sans-serif;
        }

        /* GŁÓWNY NAPIS */
        .napis {
            position: absolute;
            top: 25px;
            left: 30px;

            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7b00,
                #ffff00,
                #00ff00,
                #00ffff,
                #0066ff,
                #aa00ff,
                #ff00aa
            );

            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: kolory 5s ease infinite;
        }

        /* NAPIS POD AGARTHĄ */
        .podnapis {
            position: absolute;
            top: 70px;
            left: 30px;

            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;

            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        /* ZNAK */
        .znak {
            position: absolute;
            top: 20px;
            right: 30px;

            width: 150px;
            height: 150px;

            animation: obrot 6s linear infinite;
        }

        /* OBRAZEK NA DOLE PO LEWEJ */
        .obrazek {
            position: absolute;
            bottom: 15px;
            left: 20px;

            width: 110px;
            height: auto;

            opacity: 0.9;
        }

        /* PLAN */
        .plan {
            position: absolute;
            bottom: 15px;
            left: 150px;

            width: 192.5px;
            height: auto;

            opacity: 0.95;
        }

        /* MONSTER - PRAWY DOLNY RÓG */
        .monster {
            position: absolute;
            bottom: 15px;
            right: 25px;

            width: 180px;
            height: auto;

            opacity: 0.95;
        }

        /* PRZYCISK STRONA */
        .przycisk {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            padding: 12px 25px;

            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            border-radius: 12px;
            border: none;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7b00,
                #ffff00,
                #00ff00,
                #00ffff,
                #0066ff,
                #aa00ff,
                #ff00aa
            );

            background-size: 400% 400%;
            animation: kolory 5s ease infinite;

            box-shadow: 0 0 15px rgba(255,255,255,0.5);

            transition: transform 0.2s, box-shadow 0.2s;
        }

        .przycisk:hover {
            transform: translateX(-50%) scale(1.08);
            box-shadow: 0 0 25px rgba(255,255,255,0.8);
        }

        /* PRZYCISK MUZYKA */
        .muzyka-przycisk {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);

            padding: 12px 22px;

            color: white;
            font-size: 18px;
            font-weight: bold;

            border: none;
            border-radius: 12px;

            cursor: pointer;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7b00,
                #ffff00,
                #00ff00,
                #00ffff,
                #0066ff,
                #aa00ff,
                #ff00aa
            );

            background-size: 400% 400%;
            animation: kolory 5s ease infinite;

            box-shadow: 0 0 15px rgba(255,255,255,0.5);

            transition: transform 0.2s, box-shadow 0.2s;
        }

        .muzyka-przycisk:hover {
            transform: translateY(-50%) scale(1.08);
            box-shadow: 0 0 25px rgba(255,255,255,0.8);
        }

        @keyframes obrot {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes kolory {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>

<body>

    <div class="napis">
        AGARTHA ISTNIEJE, RZĄD NAS UCISZA
    </div>

    <div class="podnapis">
        CZIPUJĄ NAM MÓZGI
    </div>

    <img class="znak" src="znak.png" alt="Znak">

    <img class="obrazek" src="obrazek.png" alt="Obrazek">

    <img class="plan" src="plan.png" alt="Plan">

    <img class="monster" src="monster.png" alt="Monster">

    <!-- MUZYKA -->
    <audio id="muzyka" src="muzyka.mp3" loop></audio>

    <button class="muzyka-przycisk" onclick="muzykaToggle()">
        ZAGRAJ MUZYKĘ
    </button>

    <a
        class="przycisk"
        href="https://www.angels-heaven.org/english/default_en.htm"
        target="_blank"
    >
        DOWIEDZ SIĘ PRAWDY!
    </a>

    <script>
        const muzyka = document.getElementById("muzyka");
        const przyciskMuzyka = document.querySelector(".muzyka-przycisk");

        function muzykaToggle() {
            if (muzyka.paused) {
                muzyka.play();
                przyciskMuzyka.textContent = "ZATRZYMAJ MUZYKĘ";
            } else {
                muzyka.pause();
                przyciskMuzyka.textContent = "ZAGRAJ MUZYKĘ";
            }
        }
    </script>

</body>
</html>
